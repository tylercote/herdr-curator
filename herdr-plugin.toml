id = "curator"
name = "Curator"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Skill curator: usage telemetry, stale/archive lifecycle, snapshots + audit ledger with rollback, and an opt-in LLM consolidation pass over your SKILL.md library."

# Every command goes through $HERDR_PLUGIN_ROOT/bin/curator because panes may open with the
# user's repo (not the plugin) as cwd. Stdlib Python 3.9+ only — nothing to build or install.

[[build]]
command = ["sh", "-c", "python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'"]

# Install/link/update: (re)write the stable hook launcher the host agents point at, so a new
# checkout path never strands a hook. Touches nothing outside the plugin's own state dir.
[[build]]
command = ["sh", "-c", "exec python3 bin/curator hooks launcher"]

# Session start: reconcile telemetry hooks in the host agents (launcher, auto-install, skill dirs),
# show the first-run / rename-map notices, then spawn the detached 60 s scheduler daemon. The hook
# never runs a pass itself (this process exits at once); the daemon's first tick is the fully-idle
# session-start observation and every pass runs synchronously inside the daemon.
[[startup]]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" startup"]

[[panes]]
id = "skills"
title = "Curator: skills"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" pane skills"]

[[panes]]
id = "status"
title = "Curator: status"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" pane status"]

[[panes]]
id = "run"
title = "Curator: run"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" pane run"]

[[panes]]
id = "report"
title = "Curator: report"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" pane report"]

[[panes]]
id = "setup"
title = "Curator: setup"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" pane setup"]

[[panes]]
id = "console"
title = "Curator"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" pane console"]

[[actions]]
id = "skills"
title = "Curator: skills"
description = "Enable/disable, browse and edit skills (checklist, plus pin/adopt/archive/restore/edit)."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action skills"]

[[actions]]
id = "status"
title = "Curator: status"
description = "Scheduler state, managed/unmanaged counts, pins, least/most active skills."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action status"]

[[actions]]
id = "run"
title = "Curator: run (prune-only)"
description = "Snapshot, then apply the deterministic stale/archive transitions now."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action run"]

[[actions]]
id = "dry-run"
title = "Curator: dry run"
description = "Preview what a run would do; writes REPORT.md, mutates nothing."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action dry-run"]

[[actions]]
id = "consolidate"
title = "Curator: run with LLM consolidation"
description = "Prune, then fork a headless agent (skills toolset only) to build umbrella skills."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action consolidate"]

[[actions]]
id = "report"
title = "Curator: last report"
description = "Show the most recent run's REPORT.md."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action report"]

[[actions]]
id = "console"
title = "Curator: console"
description = "Interactive menu over every curator verb (pin, adopt, restore, rollback, ledger, ...)."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action console"]

[[actions]]
id = "setup"
title = "Curator: setup telemetry hooks"
description = "Install/refresh the hooks that let Claude Code, Codex, OpenCode and pi report skill loads (runs automatically at session start; this forces it now)."
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action setup"]

[[actions]]
id = "report-link"
title = "Curator: open this report"
contexts = ["pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/curator\" action report-link"]

# Ctrl-click a curator REPORT.md path printed in any pane.
[[link_handlers]]
id = "report-link"
title = "Curator: open this report"
pattern = "^file://.*/logs/curator/[^/]+/REPORT\\.md$"
action = "report-link"
