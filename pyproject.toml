[project]
name = "herdr-curator"
version = "0.2.0"
description = "Herdr plugin: background maintenance for agent-created skills (usage telemetry, stale/archive lifecycle, snapshots, audit ledger, LLM consolidation)."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:curator.*"]
